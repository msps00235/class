<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海鷗與貓咪定案</title>
<style>body{margin:0;font-family:'Noto Sans TC',sans-serif;background:#FFF8E1;color:#4A3520}
h1{font-size:20px;padding:14px 20px;margin:0}
.row{display:flex;align-items:flex-end;gap:22px;padding:14px 24px;flex-wrap:wrap}
.row img{height:88px}.label{font-size:17px;font-weight:700}
.opt{text-align:center;font-size:14px;font-weight:700}</style></head><body>
<h1>請定案：海鷗選 A 或 B、貓咪 OK 嗎？</h1>
<div class="row" style="background:#F6C21C">
<img src="art/piggybank.svg"><span class="label">✅ 撲滿已換成您選的這張（粉紅＋金幣）</span></div>
<div class="row" style="background:#8ECDF3">
<div class="opt"><img src="art/seagull-fly.svg"><br>海鷗 A：飛翔展翅</div>
<div class="opt"><img src="art/seagull-stand.svg"><br>海鷗 B：站立彩色</div>
<span class="label">藍天白雲：選 A 還是 B？</span></div>
<div class="row" style="background:#EFD3B5">
<div class="opt"><img src="art/cat-sit.svg"><br>坐姿仰望三花貓</div>
<span class="label">貓咪日常：這張 OK 嗎？</span></div>
<p style="padding:10px 20px;font-size:14px">以上皆為 SVG Repo CC0 授權。臨時頁，定案後刪除。</p>
