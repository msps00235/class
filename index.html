<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>班級網頁</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style id="page-style">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --gold:#F6C21C; --gold-deep:#E8A800; --stripe:#FFF3B0;
  --paper:#FFF8E1; --cream:#FFFDF0; --green:#EAFAB9;
  --blue:#B0D8FF; --blue-line:#6699FF;
  --ink:#4A3520; --navy:#1A2E8C; --red:#E8542A; --pink:#F7A8B8;
  --font-hand:'LXGW WenKai TC','Noto Sans TC',sans-serif;
  --font-body:'Noto Sans TC','LXGW WenKai TC',sans-serif;
}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.75}
img,svg{max-width:100%}
a{color:var(--navy)}
button{font-family:inherit}

/* ── 橫幅 ── */
.banner{position:relative;background:var(--gold);overflow:hidden}
.banner svg{display:block;width:100%;height:150px}
.banner .title{position:absolute;right:20px;top:50%;transform:translateY(-50%);text-align:right;font-family:var(--font-hand)}
.banner .title h1{margin:0;font-size:38px;font-weight:700;color:#000088;letter-spacing:2px;text-shadow:1px 1px 0 #FFF3B0}
@media (max-width:640px){
  .banner svg{height:104px}
  .banner .title{right:12px;background:rgba(255,248,225,.85);padding:3px 12px;border-radius:14px}
  .banner .title h1{font-size:22px}
}

/* ── 老師模式列 ── */
.teacherbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#FFE9A8;border-bottom:2px dashed var(--gold-deep);padding:8px 16px;font-size:15px}
.teacherbar .tag{background:var(--red);color:#FFFDF0;border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.teacherbar .spacer{flex:1}

/* ── 隨機格言 ── */
.quotebar{max-width:820px;width:calc(100% - 32px);margin:18px auto 0;padding:8px 18px;
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  background:var(--stripe);border-top:2px dotted var(--blue-line);border-bottom:2px dotted var(--blue-line);
  border-radius:999px;font-family:var(--font-hand);font-size:19px;text-align:center}
a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
@media (max-width:640px){.quotebar{font-size:16px;border-radius:20px}}

/* ── 頁籤 ── */
.tabs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:900px;margin:22px auto 0;padding:0 16px}
.tab{display:flex;align-items:center;gap:8px;border:2.5px solid var(--ink);background:var(--cream);color:var(--ink);
  font-family:var(--font-hand);font-size:20px;font-weight:700;padding:9px 22px;cursor:pointer;
  border-radius:18px 26px 16px 24px;box-shadow:2px 3px 0 rgba(74,53,32,.25);transition:transform .12s}
.tab:hover{transform:translateY(-2px)}
.tab:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.tab svg{width:24px;height:24px}
.tab.active{transform:rotate(-1.5deg) scale(1.04)}
.tab[data-tab="news"].active{background:var(--blue)}
.tab[data-tab="contact"].active{background:var(--green)}
.tab[data-tab="honor"].active{background:var(--pink)}
.tab[data-tab="sched"].active{background:var(--stripe)}
@media (max-width:640px){
  .tabs{gap:8px;flex-wrap:nowrap}
  .tab{flex:1;justify-content:center;font-size:15px;padding:7px 4px;gap:4px}
  .tab svg{width:18px;height:18px;flex:0 0 auto}
  .tab span{white-space:nowrap}
}

/* ── 內容區 ── */
.pagegrid{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;gap:20px;align-items:flex-start}
main{flex:1;min-width:0;padding:20px 0 48px}
.sidebar{flex:0 0 220px;position:sticky;top:12px;padding:20px 0 0}
@media (max-width:760px){
  .pagegrid{flex-direction:column;align-items:stretch}
  main{width:100%}
  .sidebar{position:static;flex:none;width:100%;padding-top:0}
}
.section-head{display:flex;align-items:center;gap:10px;background:var(--green);border:2px solid var(--ink);
  border-radius:999px;padding:6px 20px;margin:14px 0 18px;font-family:var(--font-hand);font-size:24px;font-weight:700}
.section-head svg{width:26px;height:26px}
.section-head .add{margin-left:auto}

.card{background:var(--cream);border-top:2px dotted var(--blue-line);border-bottom:2px dotted var(--blue-line);
  border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:0 2px 6px rgba(74,53,32,.08)}
.card .body{white-space:pre-wrap}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.datebadge{background:var(--blue);border-radius:999px;padding:1px 12px;font-size:14px;font-weight:700}
.pin{color:var(--red);font-weight:700;font-size:14px}
.empty{text-align:center;color:#8a7a5c;padding:36px 0;font-family:var(--font-hand);font-size:20px}

.itemtools{margin-left:auto;display:flex;gap:6px}
.btn{border:2px solid var(--ink);background:var(--cream);border-radius:12px;padding:4px 14px;font-size:15px;
  cursor:pointer;box-shadow:1px 2px 0 rgba(74,53,32,.25)}
.btn:hover{background:var(--stripe)}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.btn.primary{background:var(--gold);font-weight:700}
.btn.danger{background:#FFD6C9}
.btn.small{padding:2px 10px;font-size:13px;border-radius:9px}

/* 最新消息 */
.newslist{list-style:none;margin:0;padding:0}
.newslist li{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;padding:9px 2px;border-bottom:1px dashed #D9CBA3}
.newslist li:last-child{border-bottom:none}
.newslist .hdate{font-size:12px;color:#8a7a5c;margin-left:auto}
.newslist .itemtools{margin-left:0}
.newstitle{background:none;border:none;padding:0;cursor:pointer;text-align:left;
  font-family:var(--font-hand);font-size:20px;font-weight:700;color:var(--navy);
  text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--blue-line)}
.newstitle:hover{color:var(--red)}
.newstitle:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.modal.wide{max-width:640px}
.newsmodal .body{white-space:pre-wrap;margin-top:10px}
.extras{margin-top:14px;border-top:1px dashed #D9CBA3;padding-top:10px;font-size:15px}
.exline{padding:2px 0;word-break:break-all}
.hasattach{font-size:14px}
.modal input[type=file]{font-size:14px;margin-top:2px;max-width:100%}

/* 聯絡簿 */
.hwlist{margin:8px 0;padding-left:0;list-style:none;counter-reset:hw}
.hwlist li{counter-increment:hw;display:flex;gap:10px;align-items:baseline;padding:4px 0;border-bottom:1px dashed #D9CBA3}
.hwlist li::before{content:counter(hw);flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--gold);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.notebox{background:var(--stripe);border-radius:10px;padding:8px 14px;margin-top:10px;font-size:16px}
.notebox strong{color:var(--red)}
.contactwrap{display:flex;gap:18px;align-items:flex-start}
.contactmain{flex:1;min-width:0}
.calbox{flex:0 0 250px;position:sticky;top:12px;background:var(--cream);border-top:2px dotted var(--blue-line);
  border-bottom:2px dotted var(--blue-line);border-radius:14px;padding:14px 16px;box-shadow:0 2px 6px rgba(74,53,32,.08)}
.calhead{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-hand);font-size:19px;font-weight:700;margin-bottom:10px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calw{font-size:12px;font-weight:700;color:#8a7a5c;padding:2px 0}
.calgrid .calday{font-size:14px;display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;margin:0 auto;padding:0;border-radius:50%;border:2px solid transparent;color:#8a7a5c}
button.calday{cursor:pointer;background:none;color:var(--gold-deep);font-weight:700;font-size:15px;
  text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
button.calday:hover{color:var(--red)}
button.calday:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.calgrid .calday.today{border-color:var(--red);border-style:dashed}
.calgrid .calday.sel{color:var(--red)}
.callegend{font-size:12px;color:#8a7a5c;margin:10px 0 0;display:flex;align-items:center;gap:6px}
.callegend .lk{color:var(--gold-deep);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.filterbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:var(--stripe);border-radius:10px;padding:6px 14px;margin-bottom:14px;font-size:15px}
@media (max-width:760px){
  .contactwrap{flex-direction:column;align-items:stretch}
  .contactmain{width:100%}
  .calbox{position:static;width:100%;flex:none}
}

/* 榮譽榜 */
.honorlist{list-style:none;margin:0;padding:0}
.honorlist li{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;padding:9px 2px;border-bottom:1px dashed #D9CBA3}
.honorlist li:last-child{border-bottom:none}
.honorlist .honorstar{width:20px;height:20px;flex:0 0 auto;align-self:center}
.honorlist .deed{font-size:16px}
.honorlist .hdate{font-size:12px;color:#8a7a5c;margin-left:auto}
.honorlist .itemtools{margin-left:0}

/* 功課表 */
.schedwrap{overflow-x:auto;border-radius:14px}
table.sched{border-collapse:separate;border-spacing:4px;width:100%;min-width:620px;background:var(--cream);
  border-radius:14px;padding:8px;border-top:2px dotted var(--blue-line);border-bottom:2px dotted var(--blue-line)}
.sched th{background:var(--blue);border-radius:10px;padding:6px 4px;font-family:var(--font-hand);font-size:18px}
.sched th.corner{background:var(--green)}
.sched td{border-radius:10px;text-align:center;padding:7px 4px;font-size:16px;background:#F5F0DF}
.sched td.plabel{background:var(--green);font-weight:700;white-space:nowrap;padding:7px 10px}
.sched td.plabel small{display:block;font-weight:400;font-size:12px;color:#6b5a3e}
.sched tr.divider td{background:var(--stripe);font-family:var(--font-hand);font-weight:700;letter-spacing:6px}
.sched [contenteditable="true"]{outline:2px dashed var(--red);outline-offset:-2px;background:#fff;cursor:text}
.schedtools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.colorlist{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;
  background:var(--cream);border-radius:12px;padding:8px 12px}
.colorlist .collab{font-weight:700;font-size:14px}
.colorchip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;
  padding:2px 10px 2px 4px;font-size:14px;font-weight:700;cursor:pointer}
.colorchip input[type=color]{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:50%;
  padding:0;background:none;cursor:pointer}
.colorchip.picked{outline:3px solid var(--red);outline-offset:1px}
.chipname{background:none;border:none;font:inherit;font-weight:700;cursor:pointer;padding:0;color:var(--ink)}
.chipname:hover{color:var(--red)}
.chipname:focus-visible,.chipdel:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.chipdel{background:none;border:none;cursor:pointer;font-size:12px;padding:0 2px;color:#8a7a5c}
.chipdel:hover{color:var(--red)}
.schedmini{position:relative;background:var(--cream);border-top:2px dotted var(--blue-line);border-bottom:2px dotted var(--blue-line);
  border-radius:14px;padding:10px 10px 12px;box-shadow:0 2px 6px rgba(74,53,32,.08)}
.minihead{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--green);
  border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-family:var(--font-hand);
  font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;margin-bottom:8px}
.minihead svg{width:18px;height:18px}
.minihead:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
table.mini{width:100%;border-collapse:separate;border-spacing:2px;font-size:11px;line-height:1.35}
.mini th{background:var(--blue);border-radius:5px;padding:2px 1px;font-weight:700}
.mini td{background:#F5F0DF;border-radius:5px;text-align:center;padding:2px 1px}
.mini .mdiv{background:var(--stripe);letter-spacing:2px}
.minitip{font-size:11px;color:#8a7a5c;text-align:center;margin:6px 0 0}
.schedpanel{position:absolute;right:100%;top:0;z-index:40;visibility:hidden;opacity:0;transform:scale(.55);transform-origin:100% 30px;
  width:min(680px,calc(100vw - 300px));max-height:calc(100vh - 40px);overflow:auto;
  background:var(--paper);border:3px solid var(--ink);border-radius:18px;
  box-shadow:4px 6px 0 rgba(74,53,32,.3);padding:14px 16px}
.schedmini:hover .schedpanel,.schedmini.open .schedpanel{visibility:visible;opacity:1;transform:scale(1)}
.schedtitle{display:flex;align-items:center;gap:8px;font-family:var(--font-hand);font-size:22px;font-weight:700;color:var(--navy);margin-bottom:8px}
.schedtitle svg{width:24px;height:24px}
@media (prefers-reduced-motion:no-preference){.schedpanel{transition:transform .2s ease,opacity .2s ease,visibility .2s}}
@media (max-width:760px){
  .schedpanel{position:fixed;left:10px;right:10px;top:76px;width:auto;transform-origin:center top;max-height:calc(100vh - 100px)}
  .schedmini:hover:not(.open) .schedpanel{visibility:hidden;opacity:0;transform:scale(.55)}
}

/* 頁尾 */
footer{max-width:880px;margin:0 auto;padding:8px 16px 40px;display:flex;align-items:center;gap:12px;color:#8a7a5c;font-size:14px}
footer .spacer{flex:1}
.keybtn{background:none;border:none;color:#B5A379;font-size:13px;cursor:pointer;text-decoration:underline dotted}
.keybtn:hover{color:var(--ink)}

/* ── 彈出視窗 ── */
.overlay{position:fixed;inset:0;background:rgba(74,53,32,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--cream);border:3px solid var(--ink);border-radius:22px 30px 20px 28px;max-width:460px;width:100%;
  padding:22px 24px;box-shadow:4px 6px 0 rgba(74,53,32,.3);max-height:90vh;overflow-y:auto}
.modal h2{margin:0 0 14px;font-family:var(--font-hand);font-size:24px;color:var(--navy)}
.modal label{display:block;font-weight:700;font-size:15px;margin:12px 0 4px}
.modal input[type=text],.modal input[type=date],.modal input[type=password],.modal textarea{
  width:100%;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.modal textarea{min-height:96px;resize:vertical}
.modal .check{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:700;font-size:15px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.modal .hint{font-size:13px;color:#8a7a5c;margin:4px 0 0}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--cream);
  border-radius:999px;padding:8px 22px;font-size:15px;z-index:60;box-shadow:0 4px 12px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%)}}
}
</style>

</head>

/* ── 儲存（寫入資料伺服器） ── */
var saving = false;
function save(flash){
  if (saving) return;
  if (!API_URL){ toast('尚未設定資料伺服器（API_URL），無法儲存。'); return; }
  saving = true;
  toast('儲存中…', true);
  render();
  fetch(API_URL, {method:'POST', body: JSON.stringify({action:'save', pw: teacherPw, data: data})})
    .then(function(r){ return r.json(); })
    .then(function(res){
      saving = false;
      if (res && res.ok){ toast(flash || '已儲存！'); }
      else if (res && res.error === 'bad_pw'){ toast('密碼驗證失敗，請登出後重新登入再試。'); }
      else { toast('儲存失敗，請再試一次。'); }
    })
    .catch(function(){ saving = false; toast('連不上資料伺服器，請檢查網路後再試一次。'); });
}

/* ── 彈出視窗 ── */
var overlayEl = null;
function closeModal(){ if (overlayEl){ overlayEl.remove(); overlayEl = null; } }
function openModal(inner, sticky){
  closeModal();
  overlayEl = document.createElement('div');
  overlayEl.className = 'overlay';
  overlayEl.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+inner+'</div>';
  if (!sticky) overlayEl.addEventListener('click', function(ev){ if (ev.target === overlayEl) closeModal(); });
  document.body.appendChild(overlayEl);
  var f = overlayEl.querySelector('input,textarea,button');
  if (f) f.focus();
  return overlayEl;
}
function formModal(opt){
  var html = '<h2>'+esc(opt.title)+'</h2><form>';
  opt.fields.forEach(function(fl){
    if (fl.type === 'checkbox'){
      html += '<label class="check"><input type="checkbox" name="'+fl.key+'"'+(fl.value?' checked':'')+'> '+esc(fl.label)+'</label>';
    } else if (fl.type === 'file'){
      html += '<label>'+esc(fl.label)+'</label><input type="file" name="'+fl.key+'" multiple>';
    } else if (fl.type === 'textarea'){
      html += '<label>'+esc(fl.label)+'</label><textarea name="'+fl.key+'" placeholder="'+esc(fl.placeholder||'')+'">'+esc(fl.value||'')+'</textarea>';
    } else {
      html += '<label>'+esc(fl.label)+'</label><input type="'+fl.type+'" name="'+fl.key+'" value="'+esc(fl.value||'')+'" placeholder="'+esc(fl.placeholder||'')+'"'+(fl.required?' required':'')+'>';
    }
    if (fl.hint) html += '<p class="hint">'+esc(fl.hint)+'</p>';
  });
  html += '<div class="actions"><button type="button" class="btn" data-x="cancel">取消</button>'+
          '<button type="submit" class="btn primary">'+esc(opt.submitLabel||'儲存')+'</button></div></form>';
  var ov = openModal(html, true);
  ov.querySelector('[data-x=cancel]').addEventListener('click', closeModal);
  ov.querySelector('form').addEventListener('submit', function(ev){
    ev.preventDefault();
    var out = {}, form = ev.target;
    opt.fields.forEach(function(fl){
      var el = form.elements[fl.key];
      if (fl.type === 'checkbox') out[fl.key] = el.checked;
      else if (fl.type === 'file') out[fl.key] = el.files;
      else out[fl.key] = el.value.trim();
    });
    opt.onSubmit(out);
  });
}
function confirmModal(msg, onYes){
  var ov = openModal('<h2>請確認</h2><p>'+esc(msg)+'</p>'+
    '<div class="actions"><button class="btn" data-x="cancel">取消</button><button class="btn danger" data-x="yes">刪除</button></div>');
  ov.querySelector('[data-x=cancel]').addEventListener('click', closeModal);
  ov.querySelector('[data-x=yes]').addEventListener('click', function(){ closeModal(); onYes(); });
}
var toastTimer = null;
function toast(msg, sticky){
  var old = document.querySelector('.toast');
  if (old) old.remove();
  if (toastTimer) clearTimeout(toastTimer);
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  if (!sticky) toastTimer = setTimeout(function(){ t.remove(); }, 3200);
}

  list.forEach(function(n){

      '<button class="newstitle" data-act="show-news" data-id="'+n.id+'">'+esc(n.title)+'</button>'+

      '<span class="hdate">'+fmtDate(n.date)+'</span>'+toolsFor('news', n.id)+'</li>';

function showNews(item){
  if (!item) return;
  var extras = '';
  (item.links||[]).forEach(function(L){ extras += '<div class="exline">🔗 '+linkLine(L)+'</div>'; });
  (item.files||[]).forEach(function(f){
    extras += '<div class="exline">📎 <a href="'+esc(f.u)+'" target="_blank" rel="noopener">'+esc(f.n)+'</a></div>';
  });
  var ov = openModal('<div class="newsmodal"><h2>'+(item.pin?'📌 ':'')+esc(item.title)+'</h2>'+
    '<span class="datebadge">'+fmtDate(item.date)+'</span>'+
    '<div class="body">'+esc(item.body||'')+'</div>'+
    (extras ? '<div class="extras">'+extras+'</div>' : '')+
    '<div class="actions"><button class="btn primary" data-x="close">關閉</button></div></div>');
  ov.querySelector('.modal').classList.add('wide');
  ov.querySelector('[data-x=close]').addEventListener('click', closeModal);
}
function renderContact(){

  var h = sectionHead('聯絡簿', ICON.contact, 'contact');
  h += '<div class="contactwrap"><div class="contactmain">';
  var tod = today();
  var day = selDate || tod;
  var shown = list.filter(function(c){ return c.date === day; });
  if (selDate && selDate !== tod){
    h += '<div class="filterbar">正在顯示 <strong>'+fmtDate(selDate)+'</strong> 的聯絡簿'+
      '<button class="btn small" data-act="cal-all">回到今天</button></div>';
  }
  if (!shown.length){
    h += '<p class="empty">'+fmtDate(day)+'<br>'+
      (day===tod ? '今日聯絡簿尚未公佈' : '這一天沒有聯絡簿內容喔！')+'</p>';
  }
  shown.forEach(function(c){
    h += '<article class="card"><div class="meta"><span class="datebadge">'+fmtDate(c.date)+'</span>'+
      '<strong>今日功課</strong>'+toolsFor('contact', c.id)+'</div><ol class="hwlist">';
    (c.hw||[]).forEach(function(item){ h += '<li>'+esc(item)+'</li>'; });
    h += '</ol>';
    if (c.note) h += '<div class="notebox"><strong>叮嚀：</strong>'+esc(c.note)+'</div>';
    h += '</article>';
  });
  h += '</div>'+renderCalendar()+'</div>';
  return h;
}
function renderCalendar(){
  var has = {};
  data.contact.forEach(function(c){ has[c.date] = true; });
  var startDow = new Date(calY, calM, 1).getDay();
  var daysIn = new Date(calY, calM + 1, 0).getDate();
  var tod = today();
  var h = '<aside class="calbox"><div class="calhead">'+
    '<button class="btn small" data-act="cal-prev" aria-label="上個月">◀</button>'+
    '<span>'+calY+'年'+(calM+1)+'月</span>'+
    '<button class="btn small" data-act="cal-next" aria-label="下個月">▶</button></div>'+
    '<div class="calgrid">';
  '日一二三四五六'.split('').forEach(function(w){ h += '<span class="calw">'+w+'</span>'; });
  for (var i=0; i<startDow; i++) h += '<span></span>';
  for (var d=1; d<=daysIn; d++){
    var ds = calY+'-'+('0'+(calM+1)).slice(-2)+'-'+('0'+d).slice(-2);
    var cls = 'calday'+(ds===tod?' today':'')+(ds===selDate?' sel':'');
    if (has[ds]) h += '<button class="'+cls+'" data-date="'+ds+'" aria-label="看'+fmtDate(ds)+'的聯絡簿">'+d+'</button>';
    else h += '<span class="'+cls+'">'+d+'</span>';
  }
  h += '</div><p class="callegend"><span class="lk">15</span>＝有聯絡簿的日子，點一下就能看</p></aside>';
  return h;
}
function honorText(o){
  if (o.text) return o.text;
  var deed = o.deed || ((o.award||'') + (o.note ? '：'+o.note : ''));
  return (o.name ? o.name + '　' : '') + deed;
}

function subjChipHtml(sub){
  var col = subjColor(sub);
  return '<span class="colorchip" data-chip="'+esc(sub)+'" style="background:'+col+'">'+
    '<input type="color" data-subj="'+esc(sub)+'" value="'+col+'" title="更換「'+esc(sub)+'」的顏色">'+
    '<button class="chipname" data-act="subj-pick" data-n="'+esc(sub)+'">'+esc(sub)+'</button>'+
    '<button class="chipdel" data-act="subj-del" data-n="'+esc(sub)+'" title="從清單移除">✕</button></span>';
}
function liveColor(name){
  var inps = document.querySelectorAll('#subjlist input[data-subj]');
  for (var i=0;i<inps.length;i++){ if (inps[i].dataset.subj === name) return inps[i].value; }
  return subjColor(name);
}
function shortLabel(lab){
  lab = String(lab||'');
  if (lab.indexOf('早')>=0) return '早';
  var m = lab.match(/第(.)節/);
  if (m){ var i = '一二三四五六七八九十'.indexOf(m[1]); if (i>=0) return String(i+1); }
  if (lab.indexOf('午')>=0) return '午';
  return lab.charAt(0);
}

  h += '<button class="minihead" data-act="sched-toggle" aria-expanded="'+(open?'true':'false')+'">'+

    h += '<tr><th>'+esc(shortLabel(r.label))+'</th>';
    if (r.cells) r.cells.forEach(function(c){ h += '<td style="background:'+subjColor(c)+'">'+esc(c)+'</td>'; });
    else h += '<td colspan="'+s.days.length+'" class="mdiv">'+esc(r.label)+'</td>';

}

}

function findItem(arr, id){ for (var i=0;i<arr.length;i++){ if (arr[i].id===id) return arr[i]; } return null; }
function removeItem(arr, id){ var i; for (i=0;i<arr.length;i++){ if (arr[i].id===id){ arr.splice(i,1); return; } } }

function newsForm(item){
  var oldFiles = (item && item.files) ? item.files : [];
  var fields = [
    {key:'date', label:'日期', type:'date', value:item?item.date:today(), required:true},
    {key:'title', label:'標題', type:'text', value:item?item.title:'', required:true},
    {key:'body', label:'內容', type:'textarea', value:item?item.body:''},
    {key:'links', label:'相關網址（選填，一行一個，網址前可加說明文字）', type:'textarea',
      value:item?(item.links||[]).join('\n'):'', placeholder:'例如：\n學校首頁 https://www.msps.tp.edu.tw\nhttps://…'}
  ];
  oldFiles.forEach(function(f, i){
    fields.push({key:'rmf'+i, label:'移除附件：'+f.n, type:'checkbox', value:false});
  });
  if (API_URL) fields.push({key:'newfiles', label:'新增附件（可多選，單檔 15MB 以內）', type:'file'});
  fields.push({key:'pin', label:'📌 置頂這則消息', type:'checkbox', value:item?item.pin:false});
  formModal({
    title: item ? '編輯消息' : '新增消息',
    fields: fields,
    onSubmit: function(v){
      if (!v.title){ toast('標題不能空白喔'); return; }
      var links = v.links.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
      var keep = oldFiles.filter(function(f, i){ return !v['rmf'+i]; });
      var picked = [];
      if (v.newfiles){ for (var i=0; i<v.newfiles.length; i++) picked.push(v.newfiles[i]); }
      for (var j=0; j<picked.length; j++){
        if (picked[j].size > 15*1024*1024){
          toast('附件「'+picked[j].name+'」超過 15MB，請改用雲端硬碟連結分享。'); return;
        }
      }
      var finish = function(uploaded){
        var files = keep.concat(uploaded);
        if (item){ item.date=v.date; item.title=v.title; item.body=v.body; item.pin=v.pin; item.links=links; item.files=files; }
        else data.news.push({id:uid(), date:v.date, title:v.title, body:v.body, pin:v.pin, links:links, files:files});
        closeModal(); save('消息已發布！');
      };
      if (picked.length) uploadFiles(picked, finish);
      else finish([]);
    }
  });
}
function uploadFiles(list, done){
  var out = [], i = 0;
  var next = function(){
    if (i >= list.length){ done(out); return; }
    var f = list[i++];
    toast('上傳附件中…（'+i+'／'+list.length+'）', true);
    var reader = new FileReader();
    reader.onload = function(){
      var b64 = String(reader.result).split(',')[1] || '';
      fetch(API_URL, {method:'POST', body: JSON.stringify(
        {action:'upload', pw: teacherPw, name: f.name, mime: f.type, data64: b64})})
        .then(function(r){ return r.json(); })
        .then(function(res){
          if (res && res.ok){
            out.push({n: res.name, u: res.url});
            if (res.shared === false) toast('「'+f.name+'」已上傳，但無法設成公開連結（帳號限制），家長可能打不開。');
            next();
          }
          else if (res && res.error === 'bad_pw'){ toast('密碼驗證失敗，請登出後重新登入再試。'); }
          else { toast('附件「'+f.name+'」上傳失敗，請再按一次儲存重試。'); }
        })
        .catch(function(){ toast('上傳失敗，請檢查網路後再按一次儲存。'); });
    };
    reader.onerror = function(){ toast('讀取檔案失敗：'+f.name); };
    reader.readAsDataURL(f);
  };
  next();
}
function linkLine(line){
  var m = String(line).match(/https?:\/\/\S+/);
  if (!m) return '<span>'+esc(line)+'</span>';
  var url = m[0];
  var label = String(line).replace(url, '').trim() || url;
  return '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(label)+'</a>';
}
function contactForm(item){
  formModal({
    title: item ? '編輯聯絡簿' : '新增聯絡簿',
    fields: [
      {key:'date', label:'日期', type:'date', value:item?item.date:today(), required:true},
      {key:'hw', label:'今日功課（一行一項）', type:'textarea', value:item?(item.hw||[]).join('\n'):'',
        placeholder:'例如：\n國語習作 P.10～P.11\n數學課本 P.20'},
      {key:'note', label:'叮嚀事項（可留空）', type:'textarea', value:item?item.note:''}
    ],
    onSubmit: function(v){
      var hw = v.hw.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
      if (!hw.length && !v.note){ toast('功課和叮嚀至少要填一項喔'); return; }
      if (item){ item.date=v.date; item.hw=hw; item.note=v.note; }
      else data.contact.push({id:uid(), date:v.date, hw:hw, note:v.note});
      closeModal(); save('聯絡簿已更新！');
    }
  });
}
function honorForm(item){
  formModal({
    title: item ? '編輯榮譽榜' : '新增榮譽榜',
    fields: [
      {key:'date', label:'日期', type:'date', value:item?item.date:today(), required:true},
      {key:'t', label:'榮譽內容（姓名和事蹟直接一起打）', type:'text', value:item?honorText(item):'',
        placeholder:'例如：王小明　模範生', required:true}
    ],
    onSubmit: function(v){
      if (!v.t){ toast('內容不能空白喔'); return; }
      if (item){ item.date=v.date; item.text=v.t; delete item.name; delete item.deed; delete item.award; delete item.note; }
      else data.honor.push({id:uid(), date:v.date, text:v.t});
      closeModal(); save('榮譽榜已更新！');
    }
  });
}
function siteForm(){
  formModal({
    title:'網站設定', submitLabel:'儲存',
    fields:[
      {key:'title', label:'班級網頁標題（橫幅大字）', type:'text', value:data.site.title, required:true},
      {key:'sched', label:'功課表小標', type:'text', value:data.site.sched, required:true}
    ],
    onSubmit:function(v){
      if (!v.title || !v.sched){ toast('兩個欄位都要填喔'); return; }
      data.site.title = v.title; data.site.sched = v.sched;
      closeModal(); save('網站設定已更新！');
    }
  });
}
function loginForm(){
  formModal({
    title:'老師專區', submitLabel:'登入',
    fields:[{key:'pw', label:'老師密碼', type:'password', required:true,
      hint:'登入後才會出現編輯按鈕。實際的儲存權限只有網頁擁有者的帳號才有。'}],
    onSubmit:function(v){
      if (hash(v.pw) === data.pw){
        teacher = true; teacherPw = v.pw;
        try{ sessionStorage.setItem('t404','1'); sessionStorage.setItem('t404pw', v.pw); }catch(e){}
        closeModal(); render(); toast('老師您好！現在可以編輯內容了。');
      } else toast('密碼不對喔，再試一次。');
    }
  });
}
function changePwForm(){
  formModal({
    title:'修改老師密碼', submitLabel:'確定修改',
    fields:[
      {key:'p1', label:'新密碼', type:'password', required:true},
      {key:'p2', label:'再輸入一次', type:'password', required:true}
    ],
    onSubmit:function(v){
      if (v.p1.length < 4){ toast('密碼至少要 4 個字喔'); return; }
      if (v.p1 !== v.p2){ toast('兩次輸入的密碼不一樣'); return; }
      if (API_URL){
        fetch(API_URL, {method:'POST', body: JSON.stringify({action:'setpw', pw: teacherPw, newPw: v.p1})})
          .then(function(r){ return r.json(); })
          .then(function(res){
            if (res && res.ok){
              teacherPw = v.p1;
              try{ sessionStorage.setItem('t404pw', v.p1); }catch(e){}
              data.pw = hash(v.p1);
              closeModal(); save('密碼已更新！');
            } else if (res && res.error === 'bad_pw'){ toast('目前密碼驗證失敗，請登出後重新登入再試。'); }
            else { toast('修改失敗，請再試一次。'); }
          })
          .catch(function(){ toast('連不上資料伺服器，請稍後再試。'); });
        return;
      }
      data.pw = hash(v.p1);
      closeModal(); save('密碼已更新！');
    }
  });
}
function schedSave(){
  var s = data.schedule;
  document.querySelectorAll('.sched thead th[data-day]').forEach(function(th){
    s.days[+th.dataset.day] = th.textContent.trim() || '　';
  });
  document.querySelectorAll('.sched tbody tr').forEach(function(tr){
    var r = s.rows[+tr.dataset.row];
    if (!r) return;
    var lab = tr.querySelector('[data-f=label]'), tim = tr.querySelector('[data-f=time]');
    if (lab) r.label = lab.textContent.trim() || '　';
    if (tim) r.time = tim.textContent.trim();
    if (r.cells){
      tr.querySelectorAll('td[data-col]').forEach(function(td){
        r.cells[+td.dataset.col] = td.textContent.trim();
      });
    } else {
      var dt = tr.querySelector('[data-f=dividertext]');
      if (dt) r.label = dt.textContent.trim() || r.label;
    }
  });
  var colors = Object.assign({}, s.colors || {});
  document.querySelectorAll('input[type=color][data-subj]').forEach(function(inp){
    colors[inp.dataset.subj] = inp.value;
  });
  s.colors = colors;
  schedEdit = false;
  selectedSubj = '';
  save('課表已更新！');
}

root.addEventListener('click', function(ev){
  var tabBtn = ev.target.closest('[data-tab]');
  if (tabBtn){ tab = tabBtn.dataset.tab; render(); return; }
  var calDay = ev.target.closest('button.calday[data-date]');
  if (calDay){ selDate = calDay.dataset.date; render(); return; }
  if (schedEdit && selectedSubj){
    var cell = ev.target.closest('.sched td[data-col]');
    if (cell){
      cell.textContent = selectedSubj;
      cell.style.background = (selectedSubj === '—') ? '#F5F0DF' : liveColor(selectedSubj);
      return;
    }
  }
  var btn = ev.target.closest('[data-act]');
  if (!btn) return;
  var act = btn.dataset.act, id = btn.dataset.id;
  if (act==='cal-all'){ selDate = null; render(); return; }
  if (act==='cal-prev' || act==='cal-next'){
    calM += (act==='cal-next') ? 1 : -1;
    if (calM < 0){ calM = 11; calY--; }
    if (calM > 11){ calM = 0; calY++; }
    render(); return;
  }
  if (act==='login') loginForm();
  else if (act==='logout'){ teacher=false; schedEdit=false; teacherPw='';
    try{ sessionStorage.removeItem('t404'); sessionStorage.removeItem('t404pw'); }catch(e){} render(); }
  else if (act==='sitecfg') siteForm();
  else if (act==='changepw') changePwForm();
  else if (act==='show-news') showNews(findItem(data.news,id));
  else if (act==='add-news') newsForm(null);
  else if (act==='edit-news') newsForm(findItem(data.news,id));
  else if (act==='del-news') confirmModal('確定要刪除這則消息嗎？', function(){ removeItem(data.news,id); save('已刪除。'); });
  else if (act==='add-contact') contactForm(null);
  else if (act==='edit-contact') contactForm(findItem(data.contact,id));
  else if (act==='del-contact') confirmModal('確定要刪除這天的聯絡簿嗎？', function(){ removeItem(data.contact,id); save('已刪除。'); });
  else if (act==='add-honor') honorForm(null);
  else if (act==='edit-honor') honorForm(findItem(data.honor,id));
  else if (act==='del-honor') confirmModal('確定要刪除這筆榮譽紀錄嗎？', function(){ removeItem(data.honor,id); save('已刪除。'); });
  else if (act==='quote-next'){
    if (data.quotes.length > 1){
      quoteIdx = (quoteIdx + 1 + Math.floor(Math.random() * (data.quotes.length - 1))) % data.quotes.length;
      var qt = document.getElementById('quotetext');
      if (qt) qt.textContent = data.quotes[quoteIdx];
    }
  }
  else if (act==='subj-pick'){
    var pn = btn.dataset.n;
    selectedSubj = (selectedSubj === pn) ? '' : pn;
    document.querySelectorAll('#subjlist .colorchip').forEach(function(ch){
      ch.classList.toggle('picked', ch.dataset.chip === selectedSubj);
    });
  }
  else if (act==='subj-del'){
    var dn = btn.dataset.n;
    var arr = data.schedule.subjects, ix = arr.indexOf(dn);
    if (ix >= 0) arr.splice(ix, 1);
    if (selectedSubj === dn) selectedSubj = '';
    var chip = btn.closest('.colorchip'); if (chip) chip.remove();
  }
  else if (act==='subj-add'){
    formModal({
      title:'新增科目', submitLabel:'加入',
      fields:[
        {key:'n', label:'科目名稱', type:'text', required:true, placeholder:'例如：書法、閩南語、Ｅ化創客'},
        {key:'c', label:'顏色', type:'color', value:'#F5F0DF'}
      ],
      onSubmit:function(v){
        if (!v.n){ toast('請輸入科目名稱'); return; }
        var isNew = data.schedule.subjects.indexOf(v.n) < 0;
        if (isNew) data.schedule.subjects.push(v.n);
        data.schedule.colors[v.n] = v.c;
        if (isNew){
          var addBtn = document.querySelector('[data-act=subj-add]');
          if (addBtn) addBtn.insertAdjacentHTML('beforebegin', subjChipHtml(v.n));
        }
        closeModal();
        toast('已加入「'+v.n+'」，記得按「儲存課表」才會保存。');
      }
    });
  }
  else if (act==='sched-toggle'){ schedOpen=!schedOpen; if(!schedOpen) schedEdit=false; render(); }
  else if (act==='sched-edit'){ schedEdit=true; schedOpen=true; selectedSubj=''; render(); }
  else if (act==='sched-cancel'){ schedEdit=false; selectedSubj=''; render(); }
  else if (act==='sched-save') schedSave();
});
root.addEventListener('input', function(ev){
  var el = ev.target;
  if (!el.matches || !el.matches('input[type=color][data-subj]')) return;
  el.parentElement.style.background = el.value;
  var sub = el.dataset.subj;
  document.querySelectorAll('.sched td[data-col], table.mini td').forEach(function(td){
    if (td.textContent.trim() === sub) td.style.background = el.value;
  });
});
document.addEventListener('keydown', function(ev){ if (ev.key==='Escape') closeModal(); });

render();
if (API_URL){
  fetch(API_URL)
    .then(function(r){ return r.json(); })
    .then(function(remote){
      if (remote && remote.news && remote.schedule){
        data = remote;
        ensureDefaults();
        quoteIdx = Math.floor(Math.random() * Math.max(1, data.quotes.length));
      }
      loaded = true;
      render();
    })
    .catch(function(){ loadError = true; loaded = true; render(); });
}
})();
</script>
